services:
  # Base de données : Neon PostgreSQL (cloud) — pas de Postgres local par défaut.
  # Optionnel pour dev offline : décommenter le service postgres ci-dessous.

  # postgres:
  #   image: postgres:16-alpine
  #   container_name: dizipay-postgres
  #   restart: unless-stopped
  #   ports:
  #     - '5432:5432'
  #   environment:
  #     POSTGRES_USER: dizipay
  #     POSTGRES_PASSWORD: dizipay
  #     POSTGRES_DB: dizipay
  #   volumes:
  #     - dizipay_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dizipay-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - dizipay_redis:/data

volumes:
  # dizipay_pg:
  dizipay_redis:
