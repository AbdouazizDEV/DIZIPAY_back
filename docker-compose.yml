services:
  postgres:
    image: postgres:16-alpine
    container_name: dizipay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dizipay
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dizipay_db
    ports:
      - '5432:5432'
    volumes:
      - dizipay_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dizipay-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - dizipay_redis:/data

volumes:
  dizipay_pgdata:
  dizipay_redis:
